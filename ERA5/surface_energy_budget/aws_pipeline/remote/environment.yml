# Conda/micromamba environment for the analysis on an EC2 instance (or anywhere).
# Mirrors what the SEB analysis modules and aws_pipeline import; versions pin
# the majors that were used to verify the S3 backend on 2026-09-18
# (xarray 2025.10, numpy 2.3, h5py 3.14, s3fs/fsspec 2025.7, matplotlib 3.10,
# cartopy 0.25, scipy 1.16, pandas 2.3).
#
#   micromamba create -y -f environment.yml
#   micromamba activate era5-seb
name: era5-seb
channels:
  - conda-forge
dependencies:
  - python=3.12
  # Upper bounds keep the instance on the same major/feature releases the
  # laptop stack was verified with; lift them deliberately, not by accident.
  - numpy>=2.1,<2.4
  - xarray>=2025.1,<2026
  - pandas>=2.2,<3
  - scipy>=1.14,<1.17
  - matplotlib>=3.9,<3.11
  - cartopy>=0.24,<0.26
  - netcdf4>=1.7,<1.8
  - h5py>=3.12,<3.15
  - fsspec>=2025.3,<2026
  - s3fs>=2025.3,<2026
  - dask>=2025.1,<2026
  - openpyxl
  - scikit-learn
  - jupyterlab
  - ipykernel
  - nbconvert
  - cdsapi          # only for the local CDS downloader; harmless here
