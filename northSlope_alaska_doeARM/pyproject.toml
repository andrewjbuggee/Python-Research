[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "arm-nsa"
version = "0.1.0"
description = "Data pipeline for DOE ARM North Slope of Alaska (NSA) mixed-phase cloud observations"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "xarray",
    "netCDF4",
]

[project.optional-dependencies]
full = ["dask", "matplotlib", "scipy", "act-atmos", "pytest"]

[tool.setuptools]
packages = ["arm_nsa"]

[tool.black]
line-length = 88
