name: epcape
channels:
  - conda-forge
dependencies:
  - python>=3.10
  - numpy
  - pandas
  - xarray
  - netcdf4
  - requests
  - pyyaml
  - pytest
  - matplotlib     # figures in instruments/ and comparisons/
  - ipykernel      # run the analysis notebooks in this environment
  - openpyxl       # read the seasonal-averages sheet and write the summary .xlsx
